name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit tests and E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalogue
          POSTGRES_PASSWORD: catalogue
          POSTGRES_DB: catalogue
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U catalogue -d catalogue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://catalogue:catalogue@localhost:5544/catalogue
      DIRECT_URL: postgresql://catalogue:catalogue@localhost:5544/catalogue
      NEXTAUTH_URL: http://localhost:3001
      APP_URL: http://localhost:3001
      AUTH_SECRET: local-development-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
